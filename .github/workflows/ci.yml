name: Tests
on:
  push:
  pull_request:
  release:
    types: [published]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # Windows is experimental: some evaluator-runtime paths rely on
    # POSIX process semantics. Linux/macOS POSIX is the supported
    # evaluator platform for this release.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Build evaluator sandbox image
        # Linux runners have a Docker daemon; macOS runners do not. The
        # integration tests skip when the image is absent, so building it
        # here is what makes them run in CI.
        if: runner.os == 'Linux'
        run: docker build -t sis-evaluator:3.3.8 docker/sandbox
      - run: python -m pytest tests/ -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"
      - name: Verify release inventory (tags and published releases)
        # Release identity, never manifest success, selects the strict gate.
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: python tools/check_release_ci.py --mode release
      - name: Verify development inventory when current
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'release' }}
        run: python tools/check_release_ci.py --mode development
      - name: Run CLI and HTTP integration smoke
        if: runner.os == 'Linux'
        run: python tools/smoke_integration.py

  lint:
    # One pinned static gate over the production tree. The rules are
    # deliberately limited to syntax errors and pyflakes so the check
    # stays actionable; style rules are not enforced yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.0
      - run: python -m ruff check src
      - run: python -m compileall -q src tests tools

  postgres:
    # Qualifies the multi-process profile: the SQLite-only job skips the
    # cross-replica replay tests, so this job is the one that proves the
    # production claim.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sis_test
          POSTGRES_PASSWORD: sis_test
          POSTGRES_DB: sis_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Build evaluator sandbox image
        # Linux runners have a Docker daemon; macOS runners do not. The
        # integration tests skip when the image is absent, so building it
        # here is what makes them run in CI.
        if: runner.os == 'Linux'
        run: docker build -t sis-evaluator:3.3.8 docker/sandbox
      - run: python -m pytest tests/ -q
        env:
          SIS_POSTGRES_DSN: postgresql://sis_test:sis_test@127.0.0.1:5432/sis_control
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"
