name: Tests
on:
  push:
  pull_request:
  release:
    types: [published]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # Windows is experimental: some evaluator-runtime paths rely on
    # POSIX process semantics. Linux/macOS POSIX is the supported
    # evaluator platform for this release.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Build evaluator sandbox image
        # Linux runners have a Docker daemon; macOS runners do not. The
        # integration tests skip when the image is absent, so building it
        # here is what makes them run in CI.
        if: runner.os == 'Linux'
        run: docker build -t sis-evaluator:3.3.9 docker/sandbox
      - run: python -m pytest tests/ -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"
      - name: Provision the separately distributed release archive
        # release/*.zip is gitignored: the archive travels as a release
        # asset, so a fresh checkout has no copy for the strict gate. A
        # local file wins; otherwise fetch the asset for this tag. Nothing
        # downloaded is trusted: the gate re-hashes it against
        # release/release_manifest.json and the signed provenance.
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ls release/SIS-*.zip >/dev/null 2>&1; then
            echo "using the supplied release archive"
            exit 0
          fi
          if ! gh release download "${GITHUB_REF_NAME}" \
              --pattern 'SIS-*.zip' --dir release/; then
            echo "::error::No release archive for ${GITHUB_REF_NAME}. Attach SIS-*.zip to that release or place it at release/ before the strict gate runs."
            exit 1
          fi
      - name: Verify release inventory (tags and published releases)
        # Release identity, never manifest success, selects the strict gate.
        # Every trust anchor comes from repository configuration, never from
        # the artifact under test. Missing secrets fail closed.
        #
        # Repository configuration (not visible to the IDE schema):
        #   secrets: SIS_RELEASE_PUBLIC_KEY, SIS_TEST_EVIDENCE_PUBLIC_KEY,
        #            SIS_ISOLATOR_PUBLIC_KEY
        #   vars:    SIS_ISOLATION_IMAGE_DIGEST,
        #            SIS_ISOLATION_POLICY_DIGEST, SIS_ISOLATION_PROPERTIES
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: bash
        env:
          SIS_RELEASE_PUBLIC_KEY: ${{ secrets.SIS_RELEASE_PUBLIC_KEY }}
          SIS_TEST_EVIDENCE_PUBLIC_KEY: ${{ secrets.SIS_TEST_EVIDENCE_PUBLIC_KEY }}
          SIS_ISOLATOR_PUBLIC_KEY: ${{ secrets.SIS_ISOLATOR_PUBLIC_KEY }}
          SIS_ISOLATION_IMAGE_DIGEST: ${{ vars.SIS_ISOLATION_IMAGE_DIGEST }}
          SIS_ISOLATION_POLICY_DIGEST: ${{ vars.SIS_ISOLATION_POLICY_DIGEST }}
          SIS_ISOLATION_PROPERTIES: ${{ vars.SIS_ISOLATION_PROPERTIES }}
        run: |
          set -euo pipefail
          missing=""
          for name in SIS_RELEASE_PUBLIC_KEY SIS_TEST_EVIDENCE_PUBLIC_KEY \
              SIS_ISOLATOR_PUBLIC_KEY SIS_ISOLATION_IMAGE_DIGEST \
              SIS_ISOLATION_POLICY_DIGEST SIS_ISOLATION_PROPERTIES; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release trust anchors are not configured:$missing"
            exit 1
          fi
          python tools/check_release_ci.py --mode release
      - name: Verify development inventory when current
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'release' }}
        run: python tools/check_release_ci.py --mode development
      - name: Run CLI and HTTP integration smoke
        if: runner.os == 'Linux'
        run: python tools/smoke_integration.py

  test-evidence:
    # The release-qualification run: Linux, Docker present, pinned
    # runner. The artifact is the only test evidence package_release.py
    # should accept for a build-11 seal.
    #
    # Release-only: this job can sign evidence with the CI key. Running
    # it on pull requests would expose that key to PR code. The `tests`
    # job already exercises the suite on ordinary pushes and PRs.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Build evaluator sandbox image
        run: docker build -t sis-evaluator:3.3.9 docker/sandbox
      - name: Run the suite and sign the test evidence
        # This job only runs for tags and published releases, and its
        # artifact is the seal evidence: an unsigned report cannot be
        # accepted by package_release.py, so a missing key is a
        # configuration error rather than a reason to degrade quietly.
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"
          SIS_TEST_EVIDENCE_SIGNING_KEY: ${{ secrets.SIS_TEST_EVIDENCE_SIGNING_KEY }}
          SIS_TEST_EVIDENCE_KEY_ID: ${{ vars.SIS_TEST_EVIDENCE_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SIS_TEST_EVIDENCE_SIGNING_KEY:-}" ]; then
            echo "::error::SIS_TEST_EVIDENCE_SIGNING_KEY is not configured; a release seal requires signed test evidence."
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIS_TEST_EVIDENCE_SIGNING_KEY" > "$RUNNER_TEMP/test-evidence.key"
          python tools/run_tests.py \
            --json "$RUNNER_TEMP/sis-test-report.json" \
            --signing-key "$RUNNER_TEMP/test-evidence.key" \
            --key-id "${SIS_TEST_EVIDENCE_KEY_ID:-ci-test-runner}"
      - uses: actions/upload-artifact@v4
        with:
          name: test-evidence-linux-3.12
          path: ${{ runner.temp }}/sis-test-report.json

  docker-absent:
    # The suite must skip cleanly, not fail, where no daemon exists.
    # DOCKER_HOST points at a socket that cannot exist, so the CLI is
    # present but every daemon probe fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/ -q
        env:
          DOCKER_HOST: unix:///nonexistent/docker.sock
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"

  lint:
    # One pinned static gate over the production tree. The rules are
    # deliberately limited to syntax errors and pyflakes so the check
    # stays actionable; style rules are not enforced yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.0
      - run: python -m ruff check src tests tools
      - run: python -m compileall -q src tests tools

  postgres:
    # Qualifies the multi-process profile: the SQLite-only job skips the
    # cross-replica replay tests, so this job is the one that proves the
    # production claim.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sis_test
          POSTGRES_PASSWORD: sis_test
          POSTGRES_DB: sis_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Build evaluator sandbox image
        # Linux runners have a Docker daemon; macOS runners do not. The
        # integration tests skip when the image is absent, so building it
        # here is what makes them run in CI.
        if: runner.os == 'Linux'
        run: docker build -t sis-evaluator:3.3.9 docker/sandbox
      - run: python -m pytest tests/ -q
        env:
          SIS_POSTGRES_DSN: postgresql://sis_test:sis_test@127.0.0.1:5432/sis_control
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONNOUSERSITE: "1"

  sandbox-qualification:
    # Keeps the Docker sandbox evidence fresh: gVisor (runsc) from a pinned
    # release with a verified checksum, the pinned evaluator image, then
    # the containment probe, the red-team suite and the Gate 2
    # qualification. The attestation is signed with a key generated in
    # this job (trust root `qualification-only`) and never stored. This is
    # self-signed evidence that catches executor regressions; it is not
    # independent sign-off (docs/v3/SANDBOX_QUALIFICATION_GATE2.md).
    runs-on: ubuntu-latest
    env:
      # https://storage.googleapis.com/gvisor/releases/release/<version>/x86_64/
      GVISOR_RELEASE: "20261026.0"
      GVISOR_SHA512: "26e4a327565f5da0f73261a6387e2c20f4695a232e330095a3111b70efd604fdf09d734e8cc8f714dbb5c5607ce8c87ea80b26df549d83a146f2efd5a1af448a"
      EVIDENCE_DIR: ${{ github.workspace }}/sandbox-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Install gVisor (pinned release, verified SHA-512)
        shell: bash
        run: |
          set -euo pipefail
          url="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gvisor.tar.bz2" "$url"
          echo "${GVISOR_SHA512}  $RUNNER_TEMP/gvisor.tar.bz2" | sha512sum -c -
          # runsc looks for its sidecar binaries in gvisor-bin/ beside it.
          sudo mkdir -p /opt/gvisor
          sudo tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C /opt/gvisor
          /opt/gvisor/runsc --version
      - name: Register runsc with Docker
        # --oci-seccomp makes gVisor apply the container's seccomp profile
        # inside the sandbox; without it runsc ignores the profile. The
        # containerd image store lets a local build be pinned by digest.
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 tools/configure_docker_runsc.py \
            --runsc /opt/gvisor/runsc --config /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'
      - name: Build the pinned evaluator image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t sis-evaluator:3.3.9 docker/sandbox
          id="$(docker image inspect --format '{{.Id}}' sis-evaluator:3.3.9)"
          image="sis-evaluator:3.3.9@${id}"
          docker image inspect "$image" >/dev/null
          echo "SIS_SANDBOX_IMAGE=$image" >> "$GITHUB_ENV"
          echo "evaluator image: $image"
      - name: Smoke-test the gVisor runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --runtime runsc --network none \
            --security-opt seccomp=docker/sandbox/seccomp.json \
            --entrypoint python3 "$SIS_SANDBOX_IMAGE" \
            -c "v = open('/proc/version').read(); print(v); assert 'Jan 10 15:06:54 PST 2016' in v"
      - name: Probe, red team and qualify under gVisor
        # Each tool runs even when an earlier one fails, so the uploaded
        # evidence is complete; the next step fails the job on any
        # non-zero result.
        shell: bash
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE_DIR"
          status="$EVIDENCE_DIR/status.txt"
          : > "$status"
          python tools/derive_sandbox_seccomp.py
          echo "seccomp_invariants=$?" >> "$status"
          python tools/probe_docker_sandbox.py --image "$SIS_SANDBOX_IMAGE" \
            --output "$EVIDENCE_DIR/docker_sandbox_probe.json"
          echo "probe=$?" >> "$status"
          python tools/redteam_sandbox.py --image "$SIS_SANDBOX_IMAGE" \
            --output "$EVIDENCE_DIR/redteam_report.json"
          echo "redteam=$?" >> "$status"
          python tools/qualify_docker_isolation.py --image "$SIS_SANDBOX_IMAGE" \
            --trust-root qualification-only \
            --probe-report "$EVIDENCE_DIR/docker_sandbox_probe.json" \
            --redteam-report "$EVIDENCE_DIR/redteam_report.json" \
            --output "$EVIDENCE_DIR/gate2_isolation"
          echo "qualify=$?" >> "$status"
          cat "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-qualification-evidence
          path: ${{ env.EVIDENCE_DIR }}
      - name: Fail on any containment regression
        shell: bash
        run: |
          set -euo pipefail
          cat "$EVIDENCE_DIR/status.txt"
          if grep -qv '=0$' "$EVIDENCE_DIR/status.txt"; then
            echo "::error::Sandbox qualification regressed; see the sandbox-qualification-evidence artifact."
            exit 1
          fi
