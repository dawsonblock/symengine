# Resolved for CPython 3.12 on 2026-11-20. Each version had been
# published for at least two weeks, and every hash was checked against
# PyPI's JSON API. Compiled distributions (hypothesis, pyyaml) list the
# cp312 manylinux wheels for x86_64 and aarch64; pip installs one and
# --require-hashes refuses any other file. python-dateutil is held at
# 2.9.0.post0 rather than the new 3.x/4.x major releases. nose is not
# included: it does not import on Python 3.12.
